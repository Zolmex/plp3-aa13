<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <form>
        <label for="pass1">Ingrese la contraseña</label><br>
        <input type="password" id="pass1" name="pass1"><br>
        <label for="pass2">Ingrese la contraseña nuevamente</label><br>
        <input type="password" id="pass2" name="pass2"><br>
        <input type="button" onclick="probarContraseñas()" value="Enviar" id="button">
    </form>
    <script type="text/javascript">
        function probarContraseñas() {
            let contraseña1 = document.getElementById("pass1").value;
            let contraseña2 = document.getElementById("pass2").value;
            if (contraseña1 == contraseña2) {
                document.write("Las contraseñas coinciden.");
            }
            else {
                document.write("Las contraseñas NO coinciden.");
            }
        }
    </script>
</body>

</html>
