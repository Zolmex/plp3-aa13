<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
</head>

<body onload="cookies()">
    <script type="text/javascript">
        function cookies() {
            const cookies = window.navigator.cookieEnabled;
            alert(`Las cookies estan ${cookies ? 'activadas' : 'desactivadas'}`);
        }
    </script>
</body>

</html>
