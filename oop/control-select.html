<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
</head>

<body>
    <select name="pizza" id="pizza" onchange="mostrarPrecio()" onfocus="this.selectedIndex = -1;">
        <option value="jamon">Jamón</option>
        <option value="queso">Queso</option>
        <option value="muzzarella">Muzzarella</option>
        <option value="morrones">Morrones</option>
    </select>
    <p id="precio"></p>
    <script type="text/javascript">
        function mostrarPrecio() {
            let precio = 0;
            let select = document.getElementById("pizza");
            switch (select.selectedIndex) {
                case 0:
                    precio = 1500;
                    break;
                case 1:
                    precio = 1200;
                    break;
                case 2:
                    precio = 1300;
                    break;
                case 3:
                    precio = 1400;
                    break;
            }
            document.getElementById("precio").innerHTML = precio;
        }
    </script>
</body>

</html>
