<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
</head>

<body>
    <form>
        <input type="checkbox" id="deporte1" name="deporte1" value="Fútbol">
        <label for="deporte1">Fútbol</label><br>
        <input type="checkbox" id="deporte2" name="deporte2" value="Básket">
        <label for="deporte2">Básket</label><br>
        <input type="checkbox" id="deporte3" name="deporte3" value="Tenis">
        <label for="deporte3">Tenis</label><br>
        <input type="button" onclick="mostrarDeportes()" value="Mostrar">
    </form>
    <p id="precio"></p>
    <script type="text/javascript">
        function mostrarDeportes() {
            const deportes = document.querySelectorAll("input[type='checkbox']:checked");
            for (let i = 0; i < deportes.length; i++) {
                document.write(deportes[i].value + "<br>");
            }
        }
    </script>
</body>

</html>
