<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <button onclick="contador()">Contador</button>
    <script type="text/javascript">
        function contador() {
            let i = 0;
            while (i < 25) {
                let num = i * 11;
                document.write("Número: " + num + "<br>");
                i++;
            }
        }
    </script>
</body>

</html>
