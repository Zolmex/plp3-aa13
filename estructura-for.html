<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <button onclick="sumaNumeros()">Suma números</button>
    <script type="text/javascript">
        function sumaNumeros() {
            let suma = 0;
            for (let i = 0; i < 10; i++) {
                let num = parseInt(prompt("Ingrese un número"));
                if (i > 4) {
                    suma += num;
                }
            }
            document.write("La suma de los últimos 5 números es: " + suma);
        }
    </script>
</body>

</html>
